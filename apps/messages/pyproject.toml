[build-system]
requires = ["setuptools>=77"]  # PEP 639 licence expression
build-backend = "setuptools.build_meta"

[project]
name = "synwevo-messages"
version = "1.0.0"
description = "Synwevo Message：组织内的私聊与群聊，平台上的独立应用（自己的源站）"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
# Only the shared layer. The messaging service layer and its tables are in synwevo-core; this
# package is the HTTP surface and the shell. It never imports the account service or Docs.
dependencies = ["synwevo-core", "synwevo-auth-client", "fastapi"]

[tool.setuptools.packages.find]
include = ["synwevo_messages*"]

[project.urls]
Homepage = "https://github.com/WeGreen-AI/Synwevo"
Repository = "https://github.com/WeGreen-AI/Synwevo"
