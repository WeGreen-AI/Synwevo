[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synwevo-suite"
version = "1.0.0"
description = "Synwevo 业务应用：Forms、Tables、DataPrep、Approvals、Extract 与个人 Agent，挂在工作空间源站上"
requires-python = ">=3.12"
# Only the shared layer. Each application is a subpackage that never imports a sibling; they reach
# one another — and Synwevo Docs and Message — through the capability registry in synwevo-core.
#   anthropic — the personal Agent's model provider (official SDK)
#   httpx     — bounded DeepSeek streaming transport
#   openpyxl  — DataPrep and Tables read and write .xlsx
#   mcp       — Model Context Protocol server and client (official SDK)
#   jsonschema, referencing — the Agent checks a call of an external MCP tool against the
#               server's input schema, resolving its references inside that schema only
dependencies = ["synwevo-core", "synwevo-auth-client", "fastapi", "starlette", "pydantic", "anthropic", "httpx", "openpyxl", "mcp", "mcp-types", "httpx2", "jsonschema", "referencing", "anyio"]

[tool.setuptools.packages.find]
include = ["synwevo_suite*"]

[project.urls]
Homepage = "https://github.com/WeGreen-AI/Synwevo"
Repository = "https://github.com/WeGreen-AI/Synwevo"
