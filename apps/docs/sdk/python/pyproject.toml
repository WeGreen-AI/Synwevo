[build-system]
# PEP 639 license metadata (an SPDX expression plus license-files) needs setuptools 77 or later.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synwevo-docs-sdk"
version = "0.1.0"
description = "External Python client and CLI for the Synwevo Docs machine API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1,<1"]

[project.scripts]
synwevo-docs = "synwevo_docs_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synwevo_docs_sdk*"]

[tool.setuptools.package-data]
synwevo_docs_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
