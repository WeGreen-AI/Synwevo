[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synwevo-docs"
version = "1.0.0"
description = "Synwevo Docs：数据映射与批量文档生成"
requires-python = ">=3.12"
# No dependency on platform-identity: DocWeave is a relying party on the account service, it
# does not contain one.
dependencies = ["synwevo-core", "synwevo-auth-client", "fastapi", "python-multipart",
                "openpyxl", "python-docx", "python-pptx", "lxml", "pillow", "fonttools",
                "charset-normalizer", "xlrd", "olefile"]

[project.optional-dependencies]
# PyMuPDF is AGPL-3.0 (or an Artifex commercial licence). It is a real option, not the only
# way to read a PDF: `pypdfium2` is the AGPL-free engine, selected with SYNWEVO_DOCS_PDF_ENGINE.
pymupdf = ["pymupdf"]
pdfium = ["pypdfium2"]

[tool.setuptools.packages.find]
include = ["synwevo_docs*"]

[project.urls]
Homepage = "https://github.com/WeGreen-AI/Synwevo"
Repository = "https://github.com/WeGreen-AI/Synwevo"
