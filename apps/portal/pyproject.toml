[build-system]
requires = ["setuptools>=77"]  # PEP 639 licence expression
build-backend = "setuptools.build_meta"

[project]
name = "synwevo-portal"
version = "1.0.0"
description = "Synwevo Workspace：登录后的第一页与应用入口"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["synwevo-core", "synwevo-auth-client", "fastapi"]

[tool.setuptools.packages.find]
include = ["synwevo_portal*"]

[project.urls]
Homepage = "https://github.com/WeGreen-AI/Synwevo"
Repository = "https://github.com/WeGreen-AI/Synwevo"
