[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-auth-client"
version = "1.0.0"
description = "应用接入统一身份的 OIDC 依赖方适配与共用会话路由"
requires-python = ">=3.12"
dependencies = ["platform-core", "fastapi", "httpx", "authlib"]

[tool.setuptools.packages.find]
include = ["platform_auth_client*"]
