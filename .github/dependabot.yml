# Version updates go to dev, like every change (AGENTS.md「分支与发布」): weekly, a few at a time.
# Python versions are pinned in each module's requirements*.txt and again in the constraints file
# infra/server/requirements.lock, which Dependabot does not edit: a Python update also needs its lock
# line (see that file's header) before verify passes.
# Dependabot security updates ignore target-branch and always open against the default branch, main:
# retarget such a pull request to dev.
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /packages/core
      - /packages/auth-client/python
      - /services/identity
      - /apps/portal
      - /apps/docs
      - /apps/messages
      - /apps/suite
      - /infra/server
    target-branch: dev
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    # Manifests keep their ranges: Dependabot updates the lock file and raises a range only when the
    # new version falls outside it. The default strategy rewrote the shared packages' peer ranges
    # (">=19" became "^19.3.1" in packages/ui and packages/auth-client/web, #20 on 2026-10-29).
    versioning-strategy: increase-if-necessary
    # Packages that only work at one shared version move together: the Tiptap extensions augment one
    # editor type, so a single bumped extension fails typecheck (#10, #12 on 2026-10-26); likewise the
    # Yjs stack the live editors share, and react with react-dom, which refuses to load at a version
    # other than react's (#20 on 2026-10-29).
    groups:
      tiptap:
        patterns: ["@tiptap/*"]
      yjs:
        patterns: ["yjs", "y-*", "@y/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
