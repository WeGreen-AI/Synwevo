name: Verify and deploy Synwevo
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synwevo-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22', cache: npm}
      - name: Install document runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng fonts-noto-cjk
      - name: Install locked dependencies
        run: |
          python -m pip install -r infra/server/requirements-build.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e packages/core -e packages/auth-client/python -e services/identity -e apps/portal -e apps/docs -e infra/server
          python -m pip check
          npm ci
      - name: Verify and build
        run: |
          python scripts/check_boundaries.py
          python scripts/check_brand.py
          npm run typecheck
          npm run build
          npm test --workspaces --if-present
          python -m pytest --tb=short
          python -m unittest discover -s infra/production/tests -v
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Deploy through restricted SSH command
        env:
          DEPLOY_KEY: ${{ secrets.SYNWEVO_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SYNWEVO_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.SYNWEVO_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/synwevo-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/synwevo-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/synwevo-ssh/known_hosts"
          trap 'rm -f "$RUNNER_TEMP/synwevo-ssh/key"' EXIT
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/source.tar.gz"
          ssh -i "$RUNNER_TEMP/synwevo-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/synwevo-ssh/known_hosts" -o ConnectTimeout=20 "synwevo-deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA" < "$RUNNER_TEMP/source.tar.gz"
      - name: Verify public health
        run: |
          for host in synwevo.wegreen.ltd accounts.wegreen.ltd docwave.wegreen.ltd; do
            curl --fail --silent --show-error --retry 3 --max-time 20 "https://$host/readyz"
          done
