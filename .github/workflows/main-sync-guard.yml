name: Main sync source
# main is the public open-source branch and a merge-mirror of dev: it only receives sync pull requests
# whose head is dev of this repository (AGENTS.md「分支与发布」). Contributions go to dev
# (CONTRIBUTING.md). The branch rules on main require this job's check, `sync-source`, next to `verify`.
#
# Advisory, not a security boundary. A `pull_request` workflow runs from the pull request's own merge
# commit, so a pull request that edits or deletes this file, or adds another job named sync-source,
# can turn the check green. What keeps main a mirror of dev is the ruleset on main (pull request
# required, merge commits only, no force push, no deletion, nobody bypasses) together with the fact
# that only maintainers can merge. This check catches the honest mistake: a pull request opened
# against the default branch instead of dev.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]   # `edited` also covers a change of base branch
permissions: {}
jobs:
  sync-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Only dev of this repository may be merged into main
        env:
          # Branch and repository names are chosen by whoever opens the pull request: they reach the
          # shell only through the environment, are compared, and are never printed or interpolated.
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && [ "$HEAD_REF" = dev ]; then
            echo "Sync pull request from dev of $GITHUB_REPOSITORY."
          else
            echo "::error::main only receives sync pull requests from dev of this repository. Please change the base branch of this pull request to dev (see CONTRIBUTING.md)."
            exit 1
          fi
