# 从 Synwevo 仓库根目录运行：docker compose -f infra/docker-compose.yml up -d
# 构建上下文是仓库根目录（..），因为镜像要包含共享包与账户服务，不只是 apps/docs。
services:
  # 服务名从 `docweave` 改成 `synwevo`。这会改变容器名，所以**已经在跑的那个容器不会被这份文件
  # 接管**——它会继续运行，而 `up` 会另起一个新的。服务器上换名字时，先 `docker stop docweave`
  # 再 `up -d`，不要让两个进程同时打开同一个 SQLite 库。
  # 数据卷是 bind mount（`../data:/data`），所以改名不会产生第二套空卷。
  synwevo:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    # 绑定到宿主机的回环地址；对外发布请用你自己的、带鉴权的反向代理。
    ports: ["127.0.0.1:8765:8765"]
    # 宿主机的 data/ 挂到容器的 /data：数据库、blob 与安全日志都在这里，重建容器不丢。
    volumes: ["../data:/data"]
    # 运营方自己的配置：仓库根目录的 .env（`cp .env.example .env` 后按需修改），可以没有。
    # 以前这里读的是 .env.example 本身——示例里写着本机开发用的监听地址与相对数据目录，
    # 它们覆盖了镜像的设置：进程只监听容器内的回环地址（映射出来的端口连不上），数据库建在
    # /app/data（非 root 用户无权创建，容器反复重启；有权限时又落在卷外，重建即丢）。
    env_file:
      - path: ../.env
        required: false
    # 描述**容器自身**的两项固定在这里。`environment` 的优先级高于 `env_file`，所以 .env 里无论
    # 写了什么监听地址或数据目录，容器都监听所有接口（能被端口映射到达），数据都写进卷里。
    # 暴露范围由上面的 ports 决定，不由容器内的监听地址决定。
    environment:
      SYNWEVO_HOST: 0.0.0.0
      SYNWEVO_DATA_DIR: /data
    restart: unless-stopped
