# Run from /opt/synwevo/config, with IMAGE set to a reviewed immutable image tag.
name: synwevo
x-app: &app
  image: ${IMAGE:?Set IMAGE to the approved release}
  # Uvicorn's request-line log would record one-use codes/reset links in query strings.
  # The ASGI entry point enforces the same listen guard; structured audit/error logs remain.
  command: [python, -m, uvicorn, 'synwevo_server.main:app', --host, '0.0.0.0', --port, '8765', --no-access-log]
  user: '1000:1000'
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes:
    - /opt/synwevo/data:/data
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=512m,uid=1000,gid=1000,mode=1770
    - /home/synwevo:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=700
  env_file: /opt/synwevo/config/runtime.env
  logging:
    driver: json-file
    options: {max-size: '10m', max-file: '3'}
  stop_grace_period: 90s
  pids_limit: 256
  mem_limit: 768m
  cpus: 1.0
x-env: &env
  SYNWEVO_HOST: 0.0.0.0
  SYNWEVO_PORT: '8765'
  SYNWEVO_DATA_DIR: /data
  SYNWEVO_UI_AUTH: session
  SYNWEVO_COOKIE_SECURE: '1'
  SYNWEVO_TRUST_PROXY: '1'
  # Product hosts (2026-09-27 cutover, docs/platform/domain-migration.md): the platform lives on
  # synwevo.com; the old *.wegreen.ltd hosts answer 308 to their new counterparts (nginx.conf).
  SYNWEVO_ISSUER: https://accounts.synwevo.com
  SYNWEVO_PORTAL_URL: https://synwevo.com
  # Public registration uses mailbox verification; never grants platform administration.
  # A subsequently persisted administrator policy takes precedence over this environment value.
  SYNWEVO_REGISTRATION: open
  # Passkeys are bound to this RP ID. Changing the host changes the RP ID: credentials registered
  # under accounts.wegreen.ltd are shown as unusable on the account page and must be registered
  # again (services/identity/synwevo_identity/passkeys.py). Chosen to mirror the account host.
  SYNWEVO_RP_ID: accounts.synwevo.com
services:
  accounts:
    <<: *app
    # Only the identity service receives SMTP credentials. Raw preserves literal $/# in passwords.
    env_file:
      - /opt/synwevo/config/runtime.env
      - path: /opt/synwevo/config/smtp.env
        required: false
        format: raw
    environment:
      <<: *env
      SYNWEVO_ROLE: accounts
      SYNWEVO_PUBLIC_URL: https://accounts.synwevo.com
      # Member-import uploads are scanned with the same daemon as Docs uploads; `required`
      # means an import is refused (503) while the scanner is down, never waved through.
      SYNWEVO_CLAMD_ADDRESS: tcp://clamav:3310
      SYNWEVO_MALWARE_SCAN: required
    depends_on:
      clamav: {condition: service_started}
  docs:
    <<: *app
    mem_limit: 2304m
    cpus: 2.0
    environment:
      <<: *env
      SYNWEVO_ROLE: app
      SYNWEVO_APP_URL: https://docwave.synwevo.com
      SYNWEVO_PUBLIC_URL: https://docwave.synwevo.com
      SYNWEVO_OIDC_CLIENT_ID: docweave-web
      SYNWEVO_OIDC_APP_ID: docweave
      # Every uploaded file (sources, templates, resumable uploads, imports) is held in quarantine
      # until clamd says OK; while clamd is unreachable new files stay quarantined and are retried,
      # nothing already accepted stops working (docs/security/file-acceptance.md).
      SYNWEVO_CLAMD_ADDRESS: tcp://clamav:3310
      SYNWEVO_MALWARE_SCAN: required
    depends_on:
      accounts: {condition: service_healthy}
      # Not `service_healthy`: Synwevo Docs must start (and serve already-accepted files) even
      # while clamav is still loading its database; the scanner's state is in /readyz `checks`.
      clamav: {condition: service_started}
  clamav:
    # Official image (Cisco Talos; GPLv2 engine, its own container). Only the internal network
    # reaches port 3310; nothing is published on the host. Signature updates: freshclam inside
    # the container checks database.clamav.net hourly (outbound HTTPS from the VPS is required).
    # Memory: with the 3.6 M signatures of 2026-09 the daemon sits at ~1 GiB resident (measured
    # 950 MiB on ClamAV 1.5.4) and briefly doubles while reloading a fresh database; the limit
    # below covers that — check the host's free memory before adding the service.
    image: clamav/clamav:1.4
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      CLAMAV_NO_MILTERD: 'true'
      CLAMD_STARTUP_TIMEOUT: '1800'
    volumes:
      - /opt/synwevo/clamav:/var/lib/clamav
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
      - /run/clamav:rw,nosuid,nodev,size=8m
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 900s
    pids_limit: 128
    mem_limit: 2048m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  portal:
    <<: *app
    environment:
      <<: *env
      SYNWEVO_ROLE: portal
      SYNWEVO_APP_URL: https://synwevo.com
      SYNWEVO_PUBLIC_URL: https://synwevo.com
      SYNWEVO_OIDC_CLIENT_ID: portal-web
      SYNWEVO_OIDC_APP_ID: platform
    depends_on:
      accounts: {condition: service_healthy}
  messages:
    # Synwevo Message (CI-66): conversations on their own origin. The host stays message.wegreen.ltd
    # by decision (docs/platform/domain-migration.md §1), not message.synwevo.com. The process
    # registers itself in the application registry at start, which is how the account service,
    # the portal and Docs learn where the 消息 link and every conversation notification go.
    <<: *app
    environment:
      <<: *env
      SYNWEVO_ROLE: messages
      SYNWEVO_APP_URL: https://message.wegreen.ltd
      SYNWEVO_PUBLIC_URL: https://message.wegreen.ltd
      SYNWEVO_OIDC_CLIENT_ID: messages-web
      SYNWEVO_OIDC_APP_ID: messages
      # Attachments go through the same acceptance chain as Docs uploads and member imports:
      # scanned before they are stored; while the scanner is down uploads are refused (503),
      # never waved through, and everything already accepted keeps working.
      SYNWEVO_CLAMD_ADDRESS: tcp://clamav:3310
      SYNWEVO_MALWARE_SCAN: required
    depends_on:
      accounts: {condition: service_healthy}
      clamav: {condition: service_started}
  gateway:
    image: nginx:1.28-alpine
    user: '101:101'
    restart: unless-stopped
    ports: ['127.0.0.1:18760:8080', '127.0.0.1:8765:8080']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /opt/synwevo/config/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=32m,uid=101,gid=101,mode=700
      - /var/run:rw,nosuid,nodev,size=1m,uid=101,gid=101,mode=700
      - /tmp:rw,nosuid,nodev,size=16m,uid=101,gid=101,mode=700
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null --header='Host: synwevo.com' http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    pids_limit: 64
    mem_limit: 128m
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
    depends_on:
      accounts: {condition: service_healthy}
      docs: {condition: service_healthy}
      portal: {condition: service_healthy}
      messages: {condition: service_healthy}
