worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    # Do not record URLs: invitation/reset/login queries can contain one-use proofs.
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 100m;
    client_body_timeout 60s;
    send_timeout 120s;
    map $http_cf_connecting_ip $client_address {
        default $http_cf_connecting_ip;
        '' $remote_addr;
    }
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $client_address;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;
    server { listen 8080 default_server; server_name _; return 444; }
    server {
        listen 8080;
        server_name synwevo.wegreen.ltd;
        location / { proxy_pass http://portal:8765; }
    }
    server {
        listen 8080;
        server_name accounts.wegreen.ltd;
        location / { proxy_pass http://accounts:8765; }
    }
    server {
        listen 8080;
        server_name docwave.wegreen.ltd;
        location / { proxy_pass http://docs:8765; }
    }
    server {
        listen 8080;
        server_name dw.wegreen.ltd;
        # A new host means a fresh OIDC login; do not migrate a Basic cookie or password.
        return 308 https://docwave.wegreen.ltd$request_uri;
    }
}
