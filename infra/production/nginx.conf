worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    # Do not record URLs: invitation/reset/login queries can contain one-use proofs.
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 100m;
    client_body_timeout 60s;
    send_timeout 120s;
    map $http_cf_connecting_ip $client_address {
        default $http_cf_connecting_ip;
        '' $remote_addr;
    }
    # Live co-editing in Docs uses a WebSocket on the docs host (/api/collab/...). HTTP/1.1 with the
    # Upgrade/Connection pair is what makes the upstream see an upgrade; "close" for plain requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $client_address;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;
    server { listen 8080 default_server; server_name _; return 444; }
    # ---- product hosts (docs/platform/domain-migration.md) -----------------------------------
    server {
        listen 8080;
        server_name synwevo.com;
        location / { proxy_pass http://portal:8765; }
    }
    server {
        listen 8080;
        server_name accounts.synwevo.com;
        location / { proxy_pass http://accounts:8765; }
    }
    server {
        listen 8080;
        server_name docwave.synwevo.com;
        location / { proxy_pass http://docs:8765; }
        location /api/collab/ {
            proxy_pass http://docs:8765;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;       # an idle editor tab; the application re-checks the session itself
            proxy_send_timeout 3600s;
        }
    }
    # workplace.synwevo.com is an alias for the workspace: the root goes to /workspace, any other
    # path is kept (a bookmark to /workspace/... keeps working).
    server {
        listen 8080;
        server_name workplace.synwevo.com;
        location = / { return 308 https://synwevo.com/workspace; }
        location / { return 308 https://synwevo.com$request_uri; }
    }
    # ---- retired hosts: permanent, path- and query-preserving redirects ------------------------
    # 308 keeps the method, so a form or API call that still targets an old host is re-sent to
    # the new one; one-use proofs travel in the URL fragment, which browsers re-attach. Cookies
    # are host-only, so a browser arrives signed out and signs in again on the new host — that is
    # the intended behaviour of a host change, not a bug to paper over with a shared cookie domain.
    server {
        listen 8080;
        server_name synwevo.wegreen.ltd;
        return 308 https://synwevo.com$request_uri;
    }
    server {
        listen 8080;
        server_name accounts.wegreen.ltd;
        return 308 https://accounts.synwevo.com$request_uri;
    }
    server {
        listen 8080;
        server_name docwave.wegreen.ltd dw.wegreen.ltd;
        return 308 https://docwave.synwevo.com$request_uri;
    }
}
