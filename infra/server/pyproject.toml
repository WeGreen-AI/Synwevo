[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synwevo-server"
version = "1.0.0"
description = "部署组装：按角色把 Synwevo Account、Workspace 与 Docs 拼成一个进程"
requires-python = ">=3.12"
# The one distribution that may depend on all of them, because it is the deployment and not an
# application. Everything else is checked against this: no app may depend on another app.
dependencies = ["synwevo-core", "synwevo-auth-client", "synwevo-identity",
                "synwevo-portal", "synwevo-docs", "synwevo-messages", "fastapi", "uvicorn"]

[tool.setuptools.packages.find]
include = ["synwevo_server*"]

[project.urls]
Homepage = "https://github.com/WeGreen-AI/Synwevo"
Repository = "https://github.com/WeGreen-AI/Synwevo"
