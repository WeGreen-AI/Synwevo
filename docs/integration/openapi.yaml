openapi: 3.1.0
info:
  title: DocWeave 机器接口
  version: 1.0
  description: "文档批量生成引擎的自动化接口。所有 /api/v1 路由都需要 API 密钥（Authorization: Bearer dw_…）。详见 docs/integration/api.md。"
paths:
  /healthz:
    get:
      tags:
        - system
      summary: 存活检查（进程是否在运行）
      description: "无需鉴权。返回 `{\"status\":\"ok\"}`；仅测试实例额外返回 `instance`。"
      operationId: healthz_healthz_get
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema: {}
      security: []
  /readyz:
    get:
      tags:
        - system
      summary: 就绪检查（能否真正处理任务）
      description: "无需鉴权。200 `ready` / 503 `not_ready`，带 `checks` 组件级状态；不含版本、schema 版本等诊断信息。"
      operationId: readyz_readyz_get
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema: {}
      security: []
  /api/v1/capabilities:
    get:
      tags:
        - v1
      summary: 本部署真实可用的格式与依赖
      operationId: capabilities_api_v1_capabilities_get
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/whoami:
    get:
      tags:
        - v1
      summary: 当前密钥的租户与权限
      operationId: whoami_api_v1_whoami_get
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/projects:
    post:
      tags:
        - v1
      summary: 创建项目
      operationId: create_project_api_v1_projects_post
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              default: {}
              title: Body
      responses:
        201:
          description: Successful Response
          content:
            application/json:
              schema: {}
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    get:
      tags:
        - v1
      summary: 项目列表
      operationId: list_projects_api_v1_projects_get
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            title: Offset
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 200
            default: 50
            title: Limit
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema: {}
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  "/api/v1/projects/{pid}":
    get:
      tags:
        - v1
      summary: 项目详情（来源、模板、规则、映射）
