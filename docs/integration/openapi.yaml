  "/api/v1/projects/{pid}/preflight":
    post:
      tags:
        - v1
      summary: 预检：样本数、有效数、预计输出、错误与警告（simulate 时实际试生成）
      description: 不带 simulate 只需 read 权限。simulate 会在请求内逐样本实际渲染，需要 write 权限，且最多覆盖 200 个样本（true 为前 50 个）；要覆盖全部样本请提交任务。
      operationId: preflight_api_v1_projects__pid__preflight_post
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: string
            title: Pid
        - $ref: "#/components/parameters/XRequestID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              default: {}
              title: Body
              properties:
                formats:
                  type: array
                  items:
                    type: string
                naming:
                  type: string
                simulate:
                  oneOf:
                    - type: boolean
                    - type: integer
                      minimum: 1
                      maximum: 200
                  default: false
                  description: 在内存中逐样本试生成并丢弃结果，报告只在生成时才会出现的问题；不写入任何产物。true 模拟前 50 个有效样本，正整数 N（最大 200）模拟前 N 个；响应的 simulation.limited 表示是否还有未模拟的样本。需要 write 权限
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "404":
          $ref: "#/components/responses/NotFound"
        5XX:
          $ref: "#/components/responses/ServerError"
      security:
        - apiKey:
            - read
        - platformToken:
            - docweave.read
  "/api/v1/projects/{pid}/preflight/issues":
    get:
      tags:
        - v1
      summary: 预检问题明细（逐样本、逐字段，分页）
      operationId: preflight_issues_api_v1_projects__pid__preflight_issues_get
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: string
            title: Pid
        - name: level
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: error 或 warning；省略为全部
            title: Level
          description: error 或 warning；省略为全部
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            description: 跳过的条数（与 cursor 二选一）
            minimum: 0
            default: 0
            title: Offset
          description: 跳过的条数（与 cursor 二选一）
        - name: limit
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
              - type: "null"
