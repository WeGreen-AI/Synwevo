      tags:
        - v1
      summary: 导出项目定义（模板绑定 + 规则 + 映射）
      operationId: get_definition_api_v1_projects__pid__definition_get
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: string
            title: Pid
        - $ref: "#/components/parameters/XRequestID"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
