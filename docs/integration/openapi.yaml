        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "404":
          $ref: "#/components/responses/NotFound"
        5XX:
          $ref: "#/components/responses/ServerError"
      security:
        - apiKey:
            - read
        - platformToken:
            - docweave.read
    put:
      tags:
        - v1
      summary: 保存映射（带并发校验）
      operationId: put_mappings_api_v1_projects__pid__mappings_put
      parameters:
        - name: pid
          in: path
