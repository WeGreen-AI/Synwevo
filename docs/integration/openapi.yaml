    ScanVerdict:
      properties:
        status:
          type: string
          enum:
            - pending
            - clean
            - infected
            - encrypted
            - error
            - too_large
            - not_configured
            - unscanned
          title: Status
        signature:
          anyOf:
            - type: string
            - type: "null"
          title: Signature
        engine:
          anyOf:
            - type: string
            - type: "null"
          title: Engine
        reason:
          anyOf:
            - type: string
            - type: "null"
          title: Reason
        checked:
          anyOf:
            - type: boolean
            - type: "null"
          title: Checked
        sha256:
          anyOf:
            - type: string
            - type: "null"
          title: Sha256
        checked_at:
          anyOf:
            - type: number
            - type: "null"
          title: Checked At
        attempts:
          anyOf:
            - type: integer
            - type: "null"
          title: Attempts
        retry_at:
          anyOf:
            - type: number
            - type: "null"
          title: Retry At
        cycle_attempts:
          anyOf:
            - type: integer
            - type: "null"
          title: Cycle Attempts
        retry_exhausted:
          anyOf:
            - type: boolean
            - type: "null"
          title: Retry Exhausted
      type: object
      required:
        - status
      title: ScanVerdict
      description: "What the malware check concluded about these exact bytes (`sha256`). `unscanned` marks rows\nwritten before scanning existed and `not_configured` deployments without a scanner — neither is\nclean. `error`/`too_large` keep the file quarantined (`scan_failed`); the server retries `error`\nfor at most six attempts per cycle, then sets `retry_exhausted` and awaits an explicit version-guarded retry.\n`encrypted` (password-protected — or, with `checked: false`, a structure the check could not\nfinish; `reason` archive / office / pdf) is never clean: the file ends in `error` and is never\nserved (410 `encrypted_file` / `unchecked_file`); a template upload is refused with 400 and the\nsame codes; a file stored before scanning that a rescan finds encrypted keeps its state (the\nowner decides)."
