  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: "dw_<id>_<secret>"
      description: 旧式 API 密钥（CLI 签发，库中只存哈希）。权限：read、write、admin
    platformToken:
      type: oauth2
      description: 平台签发的访问令牌：服务账户用 client_credentials 向账户服务的 $ISSUER/oidc/token 申请（tokenUrl 是本地开发平台的账户服务；部署中请换成该部署的 $ISSUER，或读 $ISSUER/.well-known/openid-configuration 的 token_endpoint）；用户委托令牌来自授权码流程。每次调用都重新核验账户、成员关系与应用资格
      flows:
        clientCredentials:
          tokenUrl: "http://accounts.localhost:8770/oidc/token"
          scopes:
            docweave.read: 读取项目、模板、任务与产物（等价旧的 read）
            docweave.write: 创建、修改、提交任务（等价旧的 write）
            docweave.manage: 删除项目与模板、管理 Webhook 订阅与自身凭据（等价旧的 admin）
        authorizationCode:
          authorizationUrl: "http://accounts.localhost:8770/oidc/authorize"
          tokenUrl: "http://accounts.localhost:8770/oidc/token"
          scopes:
            docweave.read: 读取项目、模板、任务与产物（等价旧的 read）
            docweave.write: 创建、修改、提交任务（等价旧的 write）
            docweave.manage: 删除项目与模板、管理 Webhook 订阅与自身凭据（等价旧的 admin）
    delegatedToken:
      type: oauth2
      x-synwevo-identity: delegated
      description: 项目所有者本人通过授权码流程授予应用的访问令牌；使用 PKCE S256，选择来源个人工作空间并完成同意。访问密钥与 client_credentials 不可调用复制接口
      flows:
        authorizationCode:
          authorizationUrl: "http://accounts.localhost:8770/oidc/authorize"
          tokenUrl: "http://accounts.localhost:8770/oidc/token"
          scopes:
            docweave.read: 读取项目、模板、任务与产物（等价旧的 read）
            docweave.write: 创建、修改、提交任务（等价旧的 write）
            docweave.manage: 删除项目与模板、管理 Webhook 订阅与自身凭据（等价旧的 admin）
  headers:
    X-Request-ID:
      description: 本次请求的追踪 id（每个响应都有；也会出现在错误体的 request_id）
      schema:
        type: string
    Idempotent-Replayed:
      description: 为 true 表示这是同一 Idempotency-Key 的重放，响应与首次相同
      schema:
        type: string
        enum:
          - "true"
    RateLimit:
      description: IETF RateLimit 头（草案）：剩余配额 r 与恢复秒数 t
      schema:
        type: string
    RateLimit-Policy:
      description: IETF RateLimit-Policy 头（草案）：配额 q 与窗口 w
      schema:
        type: string
    Retry-After:
      description: 多少秒后可重试
      schema:
        type: integer
    Deprecation:
      description: "RFC 9745：请求用到了已弃用的输入（值为 @Unix 秒）"
      schema:
        type: string
    Sunset:
      description: RFC 8594：已弃用输入停止支持的时间（HTTP 日期）
      schema:
        type: string
    Link:
      description: "rel=\"next\"（下一页，原样请求即可）或 rel=\"deprecation\"（弃用说明）"
      schema:
        type: string
    X-Content-SHA256:
      description: 下载内容的 SHA-256
      schema:
        type: string
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: "1–255 个可打印 ASCII 字符（建议 UUID）。同一工作空间、同一路由 24 小时内：内容相同 → 重放首次的成功响应（带 Idempotent-Replayed: true）；内容不同 → 409 idempotency_conflict；首次仍在处理 → 409 idempotency_in_progress。新请求的事务失败不占用键；旧版本结果不明的记录返回 idempotency_outcome_unknown，禁止自动重做。"
      schema:
        type: string
        maxLength: 255
    XRequestID:
      name: X-Request-ID
      in: header
      required: false
      description: 可选：客户端自带的追踪 id（最多 64 个字母数字、- 或 _）
      schema:
        type: string
  responses:
    BadRequest:
      description: 请求内容不合法（error.field 指出字段）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: 凭据缺失、无效、过期或已撤销
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: 凭据有效但权限不足
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: 资源不存在或不属于该工作空间
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: 幂等键冲突、版本过期或状态不允许
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: 资源已过期或已取消，无法继续该操作
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: 文件或请求体超过大小上限
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RangeNotSatisfiable:
      description: 字节范围不可满足；检查当前 received 后继续上传
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: 超过限流
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimit-Policy"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServerError:
      description: 未预期错误（带 request_id，服务端日志有同一个 id）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
security:
  - apiKey: []
  - platformToken: []
x-undeclared-scope:
  - GET /api/v1/credentials/self
