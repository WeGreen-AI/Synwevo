openapi: 3.1.0
info:
  title: Synwevo Docs 机器接口
  version: "1.0"
  description: "Synwevo Docs 的自动化接口。/api/v1 接受两种凭据：旧式 API 密钥（Authorization: Bearer dw_<id>_<secret>，权限 read / write / admin）与平台签发的访问令牌（服务账户 client_credentials 或用户委托 authorization_code，权限 docweave.read / docweave.write / docweave.manage）。复制接口仅接受用户委托。错误统一为 {error:{code,message,field,request_id,details}}。详见 docs/integration/api.md。"
paths:
  /healthz:
    get:
      tags:
        - system
      summary: 存活检查（进程是否在运行）
      description: "无需鉴权。返回 `{\"status\":\"ok\"}`；仅测试实例额外返回 `instance`。"
      operationId: healthz_healthz_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
      security: []
  /readyz:
    get:
      tags:
        - system
      summary: 就绪检查（能否真正处理任务）
      description: "无需鉴权。200 `ready` / 503 `not_ready`，带 `checks` 组件级状态；不含版本、schema 版本等诊断信息。"
      operationId: readyz_readyz_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
      security: []
  /api/v1/capabilities:
    get:
      tags:
        - v1
      summary: 本部署真实可用的格式与依赖
      operationId: capabilities_api_v1_capabilities_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "404":
          $ref: "#/components/responses/NotFound"
        5XX:
          $ref: "#/components/responses/ServerError"
      security:
        - apiKey:
            - read
        - platformToken:
            - docweave.read
      parameters:
        - $ref: "#/components/parameters/XRequestID"
  /api/v1/whoami:
    get:
      tags:
        - v1
      summary: 当前凭据的租户与权限
      operationId: whoami_api_v1_whoami_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "404":
          $ref: "#/components/responses/NotFound"
        5XX:
          $ref: "#/components/responses/ServerError"
      security:
        - apiKey: []
        - platformToken: []
      description: 任何有效凭据都可以调用（不要求特定权限）。
      parameters:
        - $ref: "#/components/parameters/XRequestID"
  /api/v1/projects:
    post:
      tags:
        - v1
      summary: 创建项目（支持 Idempotency-Key）
      operationId: create_project_api_v1_projects_post
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              default: {}
              title: Body
              properties:
                name:
                  type: string
                  maxLength: 100
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema: {}
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            Idempotent-Replayed:
              $ref: "#/components/headers/Idempotent-Replayed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        5XX:
          $ref: "#/components/responses/ServerError"
      security:
        - apiKey:
            - write
        - platformToken:
            - docweave.write
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
    get:
      tags:
        - v1
      summary: 项目列表（按创建时间倒序；offset 或 cursor 分页）
      operationId: list_projects_api_v1_projects_get
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            description: 跳过的条数（与 cursor 二选一）
            minimum: 0
            default: 0
            title: Offset
          description: 跳过的条数（与 cursor 二选一）
        - name: limit
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
              - type: "null"
            description: 每页条数，默认 50，最大 200
            minimum: 1
            maximum: 200
            title: Limit
          description: 每页条数，默认 50，最大 200
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: 上一页返回的 next_cursor（不透明、签名，有效 24 小时，绑定工作空间、列表与筛选；与 offset 二选一；过期后从第一页重读）
            maxLength: 4096
            title: Cursor
          description: 上一页返回的 next_cursor（不透明、签名，有效 24 小时，绑定工作空间、列表与筛选；与 offset 二选一；过期后从第一页重读）
        - $ref: "#/components/parameters/XRequestID"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            Link:
              $ref: "#/components/headers/Link"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "404":
          $ref: "#/components/responses/NotFound"
        5XX:
          $ref: "#/components/responses/ServerError"
      security:
        - apiKey:
            - read
        - platformToken:
            - docweave.read
  "/api/v1/projects/{pid}":
    get:
      tags:
        - v1
      summary: 项目详情（来源、模板、规则、映射）
